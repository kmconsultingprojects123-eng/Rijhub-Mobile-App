<!doctype html>
<html><head><meta charset="utf-8">
<title>V2 Split</title>
<link rel="stylesheet" href="../kit/base.css">
<style>
  /* The logo's pin is two halves, crimson and black: the person with the
     problem and the artisan, meeting in a handshake. Here the whole canvas is
     the pin's split, and the phone stands on the seam where they meet. */
  #canvas { background: #171717; }
  .half { position: absolute; top: 0; bottom: 0; width: 660px; }
  .half.l { left: 0; background: radial-gradient(120% 70% at 30% 22%, #C2002E 0%, #A20025 42%, #7A001B 100%); }
  .half.r { right: 0; background: radial-gradient(120% 70% at 72% 22%, #2E2E2E 0%, #1A1A1A 44%, #0A0A0A 100%); }
  .grain { position: absolute; inset: 0; opacity: .5; mix-blend-mode: overlay; }

  .logo { position: absolute; left: 50%; top: 132px; height: 128px; transform: translateX(-50%); display: block; }
  .hl { position: absolute; left: 0; right: 0; top: 368px; text-align: center; color: #FFF; font-size: 158px; letter-spacing: -0.035em; line-height: .94; }
  .hl span.soft { color: #F2C4CE; }
  .hl span { width: max-content; margin: 0 auto; }
</style></head>
<body><div id="canvas">
  <div class="half l"></div><div class="half r"></div>
  <svg class="grain" width="1320" height="2868"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <img class="logo" src="../assets/brand/logo-white.png" data-box="logo">
  <h1 class="hl"><span data-box="l1">Say what’s</span><span data-box="l2">wrong.</span><span class="soft" data-box="l3">Get a trusted</span><span class="soft" data-box="l4">artisan.</span></h1>
</div>
<script src="../kit/kit.js"></script>
<script>
  const SRC = '../assets/screens/iphone-ask.png';
  const ph = phone(SRC);
  const W = 860, H = W * BODY.h / BODY.w, TOP = 1040;
  place(ph, 660, TOP + H / 2, W);
  window.layout = () => {
    // The person's words lift out on the artisan's side of the seam...
    const bubble = [671, 428, 581, 142];
    const [bx, by] = onCanvas(ph, bubble[0] + bubble[2] / 2, bubble[1] + bubble[3] / 2);
    // Centred on the original so it covers it completely.
    pop(SRC, bubble, { x: Math.min(bx + 40, 1320 - 64 - bubble[2] / 2) - bubble[2] / 2, y: by - bubble[3] / 2 - 12, rot: 3, radius: '60px 60px 16px 60px', name: 'said',
      shadow: '0 0 0 7px #FFF, 0 40px 70px -20px rgba(0, 0, 0, .6)' });
    // ...and the artisan who can fix it lifts out on the person's side.
    const row = [68, 1496, 1185, 395], s = 0.9;
    const [rx, ry] = onCanvas(ph, row[0] + row[2] / 2, row[1] + row[3] / 2);
    pop(SRC, row, { x: 600 - (row[2] * s) / 2, y: ry - (row[3] * s) / 2 + 30, scale: s, rot: -3, radius: 56, name: 'match',
      shadow: '0 60px 110px -30px rgba(0, 0, 0, .65), 0 16px 34px -12px rgba(0, 0, 0, .35)' });
  };
</script>
</body></html>
