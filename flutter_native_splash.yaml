# Native launch screen. Matches the Flutter splash (lib/features/onboarding/
# splash_screen.dart): brand crimson with the white wordmark, so launch has
# no white flash. Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#A20025"
  color_dark: "#A20025"
  # 4x artwork: shows at 196x64 points, the same size as the Flutter splash.
  image: assets/brand/splash/splash_logo.png
  image_dark: assets/brand/splash/splash_logo.png
  android_12:
    # Android 12+ shows an icon-sized mark, so it uses the monogram.
    color: "#A20025"
    color_dark: "#A20025"
    image: assets/brand/splash/splash_android12.png
    image_dark: assets/brand/splash/splash_android12.png
  android: true
  ios: true
  web: false
